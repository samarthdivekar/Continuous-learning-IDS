<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GNN-IDS Console</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>
<body>
<header class="appbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><circle cx="12" cy="10" r="1.6"/><path d="M6.8 7.2 10.6 9.3M17.2 7.2l-3.8 2.1M12 11.7V15.8"/></svg>
    </div>
    <div>
      <h1>GNN-IDS Security Console</h1>
      <p>Continual-learning graph intrusion detection · EWC + subgraph replay + ADWIN</p>
    </div>
  </div>
  <div class="controls">
    <div class="seg" id="ds-seg" role="group" aria-label="dataset">
      <button data-v="cicids2017" class="on">CIC-IDS2017</button>
      <button data-v="csecicids2018">CSE-CIC-IDS2018</button>
    </div>
    <div class="seg" id="mode-seg" role="group" aria-label="label mode">
      <button data-v="multiclass" class="on">Multiclass</button>
      <button data-v="binary">Binary</button>
    </div>
    <div class="pills">
      <span class="pill" id="pill-api"><i class="dot"></i>API</span>
      <span class="pill" id="pill-ml"><i class="dot"></i>ML</span>
      <span class="pill" id="pill-db"><i class="dot"></i>DB</span>
      <span class="pill" id="pill-stream"><i class="dot"></i><span>Stream idle</span></span>
    </div>
    <button class="icon-btn" id="theme-btn" title="Toggle light/dark">◐</button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab on" data-view="overview">Overview</button>
  <button class="tab" data-view="live">Live Stream <span class="badge hidden" id="live-badge">LIVE</span></button>
  <button class="tab" data-view="explorer">Graph Explorer</button>
  <button class="tab" data-view="compare">Model Comparison</button>
  <button class="tab" data-view="drift">Drift Analysis</button>
  <button class="tab" data-view="general">Generalisation</button>
  <button class="tab" data-view="classify">Classify</button>
  <button class="tab" data-view="repro">Reproducibility</button>
</nav>

<main>
  <section class="view on" id="view-overview"></section>
  <section class="view" id="view-live"></section>
  <section class="view" id="view-explorer"></section>
  <section class="view" id="view-compare"></section>
  <section class="view" id="view-drift"></section>
  <section class="view" id="view-general"></section>
  <section class="view" id="view-classify"></section>
  <section class="view" id="view-repro"></section>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
