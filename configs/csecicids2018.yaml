dataset: csecicids2018
dataset_info:
  name: CSE-CIC-IDS2018 (improved / error-corrected, Liu et al. 2022)
  archive: CSECICIDS2018_improved.zip
  url: https://intrusion-detection.distrinet-research.be/CNS2022/Datasets/CSECICIDS2018_improved.zip
  extract_dir: csecicids2018
preprocessing:
  # 2018 has 63.2 M flows (~30x CIC-IDS2017) and does not fit 24 GB RAM with 83
  # float features. Every flow is kept with probability 0.15 INDEPENDENTLY OF
  # ITS LABEL (seeded), i.e. a 1-in-~7 sampled flow export. Graphs become
  # uniformly sparser; the benign/attack mix and all topology decisions stay
  # label-free. Recorded in run_info.json and meta.json load_stats.
  flow_sample_fraction: 0.15
# Hyper-parameters are NOT re-tuned on 2018 (compute budget). The validation-
# selected values from CIC-IDS2017 (tuning/selected.yaml and the per-model
# ewc_lambda_sweep/selected.json) are reused via `tuning_from`. The ewc block
# below is only the fallback if those files are absent.
tuning_from: cicids2017
ewc:
  lambda: 10.0
  gamma: 0.9
